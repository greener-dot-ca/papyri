<!DOCTYPE html>
<!-- vim: set softtabstop=4 tabstop=4 shiftwidth=4 expandtab: -->
<html>
<head>
    
    <title>Papyri</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The web-map JS is inline here, so a cached page means stale code.
         Force the browser to revalidate index.html on every load. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <link rel="shortcut icon" type="image/png" href="./papyri-32x32.png" />
    <link rel="icon" type="image/png" href="./papyri-32x32.png"/>

    <link rel="stylesheet" href="./assets/css/papyri.css"/>
    
    <link rel="stylesheet" href="./assets/css/leaflet.css"/>
    <script src="./assets/js/leaflet.js"></script>

    <script src="./assets/js/leaflet-fullHash.js"></script>

    <link rel="stylesheet" href="./assets/css/MarkerCluster.css"/>
    <link rel="stylesheet" href="./assets/css/MarkerCluster.Default.css"/>
    <script src="./assets/js/leaflet.markercluster.js"></script>

    <script src="./assets/js/leaflet-pip.js"></script>

    <!-- Leaflet Control Search Plugin -->
    <link rel="stylesheet" href="./assets/css/leaflet-search.min.css"/>
    <script src="./assets/js/leaflet-search.min.js"></script>

    <style>
        .leaflet-control-search input {
            font-size: 1rem;
        }
        .leaflet-container .leaflet-control-mouseposition {
            background-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 5px #bbb;
            padding: 0 5px;
            margin: 0;
            color: #333;
            font: 11px/1.5 "Helvetica Neue", Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>

<div id='map'></div>

<script>

    const dimSet = new Set();
    let tileLayers = {};
    const tilesUrl = './tiles/{id}/{z}/{x}/{y}.png';
    let overlays = {};
    let overlaysHash = {};
    // Per-dimension search records: { displayText: loc } where loc is an
    // L.latLng carrying .overlay (which overlay it belongs to) and, for maps,
    // .bounds. This is exactly the shape the search plugin indexes.
    let searchIndex = {};
    let allBanners = [];
    let map;
    let control;
    let searchControl;
    let currentDimension = "minecraft@overworld";

    // Half-width of a Minecraft world (default world border radius, in blocks).
    // The world spans this many blocks out from 0,0 in each direction.
    const WORLD_BORDER = 29999984;
    const worldBounds = L.latLngBounds(
        [-WORLD_BORDER, -WORLD_BORDER],
        [WORLD_BORDER, WORLD_BORDER]
    );

    async function loadJSON(file) {
        const response = await fetch(file);
        return response.json();
    }

    const factor = 1 / 2 ** 16;
    L.CRS.pr = L.extend({}, L.CRS.Simple, {
        projection: L.Projection.LonLat,
        transformation: new L.Transformation(
            factor,
            64 * factor,
            factor,
            64 * factor),
        scale: function(zoom) {
            return Math.pow(2, zoom);
        },

        zoom: function(scale) {
            return Math.log(scale) / Math.LN2;
        },

        distance: function(latlng1, latlng2) {
            const dx = latlng2.lng - latlng1.lng;
            const dy = latlng2.lat - latlng1.lat;

            return Math.sqrt(dx * dx + dy * dy);
        },

        infinite: true
    });


    const IDcolors = ["red", "blue", "green", "purple", "orange"];
    const scaleText = ["1:1", "1:2", "1:4", "1:8", "1:16"];
    const regionGradient = ["#fb0004","#f70008","#f3000c","#ef0010","#eb0014","#e70018","#e4001b","#e0001f","#dc0023","#d80027","#d4002b","#d0002f","#cc0033","#c80037","#c4003b","#c0003f","#bc0043","#b80047","#b4004b","#b1004e","#ad0052","#a90056","#a5005a","#a1005e","#9d0062","#990066","#95006a","#91006e","#8d0072","#890076","#85007a","#81007e","#7e0081","#7a0085","#760089","#72008d","#6e0091","#6a0095","#660099","#62009d","#5e00a1","#5a00a5","#5600a9","#5200ad","#4e00b1","#4b00b4","#4700b8","#4300bc","#3f00c0","#3b00c4","#3700c8","#3300cc","#2f00d0","#2b00d4","#2700d8","#2300dc","#1f00e0","#1b00e4","#1800e7","#1400eb","#1000ef","#0c00f3","#0800f7","#0400fb"];

    const clusterGroupConfig = {
        iconCreateFunction: function(cluster) {
            return L.divIcon({
                iconSize: [576, 48],
                className: 'banner-marker',
                html: `<img class="banner-image" src="./assets/banner-images/multiple.png"/><span class="banner-name">${cluster.getChildCount()}</span>`
            });
        }
    };

    function handleClick(e) {
        let html = '<span style="font-size:16px;font-family:unifont">';
        const match = leafletPip.pointInLayer(
            e.latlng,
            e.target,
            false
        );
        if (match.length) {
            for (const m of match) {
                const maps = m.feature.properties.maps;
                const scale = m.feature.properties.scale;
                html += `<span style="color:${IDcolors[scale]}">`;
                html += `${scaleText[scale]} scale:</span></br>`;
                for (const mapItem of maps) {
                    html += `map ID ${mapItem.id}</br>`;
                    html += `<img src="./maps/${mapItem.filename}" height="256" width="256"/></br>`;
                    const banners = mapItem.banners;
                    html += "<table>";
                    for (const banner of banners) {
                        html += "<tr>";
                        html += `<td style="vertical-align: top"><img style="float: left;" src="./assets/banner-images/${banner[4]}banner.png"/></td>`;
                        html += `<td>text: "${banner[3]}"</br> XYZ: ${banner[0]} / ${banner[1]} / ${banner[2]}</br></td>`;
                        html += "</tr>";
                    }
                    const frames = mapItem.frames;
                    for (const frame of frames) {
                        html += "<tr>";
                        html += `<td><img src="./assets/banner-images/marker.png" style="transform: rotate(${frame.rotation}deg);"></td>`;
                        html += `<td>XYZ: ${frame.X} / ${frame.Y} / ${frame.Z}</br></td>`;
                        html += "</tr>";
                    }
                    html += "</table></br>";
                }
            }
            html += "</span>";
        }
        if (html) {
            map.openPopup(html, e.latlng, {maxHeight: 320, maxWidth: 300, minWidth: 300});
        }
    }

    const styleMaps = {
        style: function(feature) {
            return {color: IDcolors[feature.properties.scale]};
        }
    };

    const styleCustom = {
        style: function(feature) {
            return feature.properties.style;
        }
    };

    // The search box always covers everything in the current dimension —
    // banner names and every map ID — regardless of which overlays are
    // currently shown. searchIndex[dimension] holds the records, each tagging
    // the overlay it belongs to so the result can switch that overlay on.
    function createSearchControl() {
        return new L.Control.Search({
            position: 'topleft',
            initial: false,
            // Feed the index for the current dimension straight from memory,
            // so search is independent of which layers are on the map. It's
            // already in the plugin's {displayText: location} record shape, so
            // formatData just passes it through.
            sourceData: function(text, callback) {
                callback(searchIndex[currentDimension] || {});
            },
            formatData: function(records) {
                return records;
            },
            // Make sure the result's overlay is enabled so it's actually
            // visible, then fit a map polygon to view (point results like
            // banners have no bounds, so fall back to a fixed zoom).
            moveToLocation: function(latlng, title, map) {
                const overlay = overlays[currentDimension][latlng.overlay];
                if (overlay && !map.hasLayer(overlay)) {
                    overlay.addTo(map);
                }
                if (latlng.bounds) {
                    map.fitBounds(latlng.bounds);
                } else {
                    map.setView(latlng, 18);
                }
            },
            marker: false,
            autoCollapse: true,
            autoType: false,
            // Every map is indexed as "map ID xxx", so a broad query can match
            // thousands; cap how many tips render to keep the list responsive.
            tooltipLimit: 50,
            minLength: 1
        });
    }

    function remControl(event) {
        control.remove();
        control = L.control.layers(tileLayers, overlays[event.name]);
        control.addTo(map);
    }

    async function loadCustomOverlays() {
        try {
            const manifest = await loadJSON('overlays.json');
            const overlayPromises = manifest.overlays.map(file =>
                loadJSON(file).catch(err => {
                    console.warn(`Could not load overlay: ${file}`, err);
                    return [];
                })
            );
            const overlayDataSets = await Promise.all(overlayPromises);

            for (const overlayData of overlayDataSets) {
                for (const feature of overlayData) {
                    overlays[feature.properties.dimension]['custom'].addData(feature);
                }
            }
        } catch (err) {
            console.log('No overlays.json manifest found, skipping custom overlays');
        }
    }

    async function init() {
        const mapsData = await loadJSON('maps.json');

        for (const marker of mapsData) {
            dimSet.add(marker.properties.dimension);
        }

        for (const val of dimSet) {
            tileLayers[val] = L.tileLayer(tilesUrl, {id: val, maxZoom: 20, maxNativeZoom: 17});
            overlays[val] = {
                "banners": L.markerClusterGroup(clusterGroupConfig),
                "custom": L.geoJSON(null, styleCustom),
                "maps": L.geoJSON(null, styleMaps).on('click', handleClick)
            };
            overlaysHash[val] = tileLayers[val];
            overlaysHash[val + "_" + "banners"] = overlays[val]["banners"];
            overlaysHash[val + "_" + "maps"] = overlays[val]["maps"];
            overlaysHash[val + "_" + "custom"] = overlays[val]["custom"];
            searchIndex[val] = {};
        }

        const [bannersData] = await Promise.all([
            loadJSON('banners.json'),
            loadCustomOverlays()
        ]);

        allBanners = bannersData;

        for (const bannerItem of bannersData) {
            const geoJsonFeature = {
                type: "Feature",
                geometry: {
                    type: "Point",
                    coordinates: [bannerItem.X, bannerItem.Z]
                },
                properties: {
                    title: bannerItem.name,
                    name: bannerItem.name,
                    color: bannerItem.color,
                    dimension: bannerItem.dimension
                }
            };

            const marker = L.marker([bannerItem.Z, bannerItem.X], {
                title: bannerItem.name,
                icon: L.divIcon({
                    className: 'banner-marker',
                    iconSize: [24, 32],
                    iconAnchor: [12, 16],
                    html: `<img class="banner-image" src="./assets/banner-images/${bannerItem.color}banner.png"/><span class="banner-name">${bannerItem.name}</span>`
                })
            });

            marker.feature = geoJsonFeature;
            marker.addTo(overlays[bannerItem.dimension]['banners']);

            const bannerLoc = L.latLng(bannerItem.Z, bannerItem.X);
            bannerLoc.overlay = 'banners';
            searchIndex[bannerItem.dimension][bannerItem.name] = bannerLoc;
        }

        for (const mapFeature of mapsData) {
            const dimension = mapFeature.properties.dimension;
            overlays[dimension]['maps'].addData(mapFeature);

            // Index every map ID individually as "map ID xxx", pointing at the
            // map polygon's bounds so selecting it fits the whole map to view.
            const bounds = L.geoJSON(mapFeature).getBounds();
            for (const amap of mapFeature.properties.maps) {
                const mapLoc = bounds.getCenter();
                mapLoc.overlay = 'maps';
                mapLoc.bounds = bounds;
                searchIndex[dimension][`map ID ${amap.id}`] = mapLoc;
            }
        }

        map = L.map('map', {
            crs: L.CRS.pr,
            layers: [tileLayers["minecraft@overworld"]],
            maxBounds: worldBounds,
            maxBoundsViscosity: 1.0
        });

        // Pixel-art tiles seam when the map pane comes to rest at a fractional
        // pixel offset (e.g. after a pan), because each tile is rasterized
        // independently and a sub-pixel gap opens between neighbours. Snap the
        // pane to whole pixels once movement settles so tiles stay aligned.
        function snapMapPaneToPixel() {
            const pane = map.getPanes().mapPane;
            const pos = L.DomUtil.getPosition(pane);
            if (pos) {
                L.DomUtil.setPosition(pane, L.point(Math.round(pos.x), Math.round(pos.y)));
            }
        }
        map.on('moveend zoomend viewreset', snapMapPaneToPixel);

        // Faint grid aligned to the .mca region files (512x512 blocks).
        // Lives in its own pane below the base tiles, so it sits under
        // everything and only shows through where the map isn't rendered yet.
        map.createPane('regionGrid');
        map.getPane('regionGrid').style.zIndex = 150;
        map.getPane('regionGrid').style.pointerEvents = 'none';

        const RegionGrid = L.GridLayer.extend({
            createTile: function(coords) {
                const tile = document.createElement('canvas');
                const size = this.getTileSize();
                tile.width = size.x;
                tile.height = size.y;
                const ctx = tile.getContext('2d');

                const map = this._map;
                const zoom = coords.z;
                // Top-left pixel of this tile, in the map's projected space.
                const origin = coords.scaleBy(size);
                // True block-coordinate extent of the tile (X = lng, Z = lat).
                const bounds = this._tileCoordsToBounds(coords);
                const minX = bounds.getWest();
                const maxX = bounds.getEast();
                const minZ = bounds.getSouth();
                const maxZ = bounds.getNorth();

                // One line per .mca region boundary, fixed at every 512 blocks.
                // Each line is projected through the same CRS the cursor uses,
                // so the grid stays aligned with the mouse-position readout.
                // Clamp to the world border so the grid stops at the world edge.
                const step = 512;
                const lineMinX = Math.max(minX, -WORLD_BORDER);
                const lineMaxX = Math.min(maxX, WORLD_BORDER);
                const lineMinZ = Math.max(minZ, -WORLD_BORDER);
                const lineMaxZ = Math.min(maxZ, WORLD_BORDER);

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
                ctx.lineWidth = 1;
                ctx.beginPath();

                for (let x = Math.ceil(lineMinX / step) * step; x <= lineMaxX; x += step) {
                    const px = Math.round(map.project([0, x], zoom).x - origin.x) + 0.5;
                    ctx.moveTo(px, 0);
                    ctx.lineTo(px, size.y);
                }
                for (let z = Math.ceil(lineMinZ / step) * step; z <= lineMaxZ; z += step) {
                    const py = Math.round(map.project([z, 0], zoom).y - origin.y) + 0.5;
                    ctx.moveTo(0, py);
                    ctx.lineTo(size.x, py);
                }

                ctx.stroke();
                return tile;
            }
        });

        new RegionGrid({ pane: 'regionGrid', bounds: worldBounds }).addTo(map);

        // Inline mouse-position control (replaces the L.Control.MousePosition
        // plugin): shows Minecraft block X/Z plus chunk and region coordinates.
        const MousePosition = L.Control.extend({
            options: { position: 'bottomleft' },
            onAdd: function(map) {
                this._container = L.DomUtil.create('div', 'leaflet-control-mouseposition');
                L.DomEvent.disableClickPropagation(this._container);
                map.on('mousemove', this._onMouseMove, this);
                return this._container;
            },
            onRemove: function(map) {
                map.off('mousemove', this._onMouseMove, this);
            },
            _onMouseMove: function(e) {
                const x = Math.round(e.latlng.lng);
                const z = Math.round(e.latlng.lat);
                this._container.innerHTML =
                    `XZ: ${x} / ${z}&nbsp;&nbsp;Chunk: ${x >> 4} ${z >> 4}&nbsp;&nbsp;Region: ${x >> 9} ${z >> 9}`;
            }
        });
        new MousePosition().addTo(map);

        const homeButton = L.Control.extend({
            options: {
                position: 'topleft'
            },
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                const button = L.DomUtil.create('a', '', container);
                button.href = '#';
                button.title = 'Zoom to all markers';
                button.innerHTML = '🏠';
                button.style.width = '30px';
                button.style.height = '30px';
                button.style.lineHeight = '30px';
                button.style.textAlign = 'center';
                button.style.fontSize = '16px';

                L.DomEvent.on(button, 'click', function(e) {
                    L.DomEvent.preventDefault(e);
                    const group = new L.featureGroup([overlays[currentDimension]["banners"]]);
                    map.fitBounds(group.getBounds().pad(0.1));
                });

                return container;
            }
        });

        map.addControl(new homeButton());

        map.fitBounds([[-1000, -1000], [1000, 1000]]);

        console.log("adding initial layer");
        control = L.control.layers(tileLayers, overlays["minecraft@overworld"]);
        control.addTo(map);
        const hash = new L.Hash(map, overlaysHash);

        // The control reads searchIndex[currentDimension] live, so it never
        // needs rebuilding — it always reflects the current dimension.
        searchControl = createSearchControl();
        map.addControl(searchControl);

        map.on('baselayerchange', function(event) {
            map.closePopup();

            // Remember which overlay types are currently selected so the
            // selection carries over to the new dimension.
            const activeOverlayTypes = Object.entries(overlays[currentDimension])
                .filter(([overlayName, overlay]) => map.hasLayer(overlay))
                .map(([overlayName]) => overlayName);

            currentDimension = event.name;

            for (const [dimName, dimOverlays] of Object.entries(overlays)) {
                for (const [overlayName, overlay] of Object.entries(dimOverlays)) {
                    overlay.remove();
                }
            }

            remControl(event);

            // Re-apply the previously selected overlays for the new dimension.
            for (const overlayName of activeOverlayTypes) {
                overlays[currentDimension][overlayName].addTo(map);
            }
        });
    }

    init();

</script>
</body>
</html>
